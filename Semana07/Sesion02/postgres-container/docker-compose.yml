version: "3.8"

services:
  postgres:
    container_name: postgres-container
    image: postgres:latest
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network

volumes:
  postgres_data:

networks:
  my_network:
    external: true
